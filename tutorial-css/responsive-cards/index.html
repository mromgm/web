<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Responsive Column Cards with CSS Grid</title>
</head>

<body>
    <div class="grid-container">
        <div class="card">
            <header>Pendiente</header>
            <div class="card-container">
                <p>Estado pendiente</p>
            </div>
            <footer>
                <button>Pendiente</button>
            </footer>
        </div>
        <div class="card">
            <header>Cargado</header>
            <div class="card-container">
                <p>Estado cargado</p>
            </div>
            <footer>
                <button>Cargado</button>
            </footer>
        </div>
        <div class="card">
            <header>Procesado</header>
            <div class="card-container">
                <p>Estado procesado</p>
            </div>
            <footer>
                <button>Procesado</button>
            </footer>
        </div>
    </div>
</body>

</html>
